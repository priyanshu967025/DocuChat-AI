version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: docuchat_db
    environment:
      POSTGRES_DB: ${DB_NAME:-docuchat_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docuchat_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: docuchat_web
    command: sh -c "python manage.py migrate && gunicorn doc_qa_project.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgres
      - DB_NAME=${DB_NAME:-docuchat_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen2.5-72B-Instruct}
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery:
    build: .
    container_name: docuchat_celery
    command: celery -A doc_qa_project worker --loglevel=info
    environment:
      - DB_ENGINE=postgres
      - DB_NAME=${DB_NAME:-docuchat_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
