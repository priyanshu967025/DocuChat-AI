{% extends 'base.html' %}

{% block title %}Login — DocuChat AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div style="width: 70px; height: 70px; background: rgba(99, 102, 241, 0.12); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 1.8rem;">
                    🔐
                </div>
                <h2 class="gradient-text mt-3 fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to access your documents and chats</p>
            </div>
            
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label text-slate-300">
                        <i class="bi bi-person" style="color: #818cf8;"></i> Username
                    </label>
                    <input type="text" 
                           class="form-control" 
                           id="id_username" 
                           name="username" 
                           placeholder="Enter your username"
                           required 
                           autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="id_password" class="form-label text-slate-300">
                        <i class="bi bi-lock" style="color: #818cf8;"></i> Password
                    </label>
                    <input type="password" 
                           class="form-control" 
                           id="id_password" 
                           name="password" 
                           placeholder="Enter your password"
                           required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="text-decoration-none gradient-text fw-semibold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
