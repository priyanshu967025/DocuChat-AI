{% extends 'base.html' %}

{% block title %}Register — DocuChat AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div style="width: 70px; height: 70px; background: rgba(99, 102, 241, 0.12); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 1.8rem;">
                    👤
                </div>
                <h2 class="gradient-text mt-3 fw-bold">Create Account</h2>
                <p class="text-muted">Start chatting with your documents using RAG</p>
            </div>
            
            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label text-slate-300">
                        <i class="bi bi-person" style="color: #818cf8;"></i> Username
                    </label>
                    <input type="text" 
                           class="form-control" 
                           id="id_username" 
                           name="username" 
                           placeholder="Choose a username"
                           required 
                           autofocus>
                </div>
                
                <div class="mb-3">
                    <label for="id_password1" class="form-label text-slate-300">
                        <i class="bi bi-lock" style="color: #818cf8;"></i> Password
                    </label>
                    <input type="password" 
                           class="form-control" 
                           id="id_password1" 
                           name="password1" 
                           placeholder="Create a strong password"
                           required>
                </div>
                
                <div class="mb-4">
                    <label for="id_password2" class="form-label text-slate-300">
                        <i class="bi bi-lock-fill" style="color: #818cf8;"></i> Confirm Password
                    </label>
                    <input type="password" 
                           class="form-control" 
                           id="id_password2" 
                           name="password2" 
                           placeholder="Confirm your password"
                           required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Already have an account? 
                    <a href="{% url 'login' %}" class="text-decoration-none gradient-text fw-semibold">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
